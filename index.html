<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba conexión</title>
</head>

<body>

<h1>PRUEBA ESTADO DE FUERZA</h1>

<div id="resultado">
    Conectando...
</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxP3-4RBiMMVSmWAyamj9-HC4pR5Z2rx0KzDlyIsWWJ2iHILoFCxzGosRmWcz8rTq4/exec";


const callbackName =
"prueba_" + Date.now();


window[callbackName] = function(data){

    console.log("RESPUESTA:", data);

    document.getElementById("resultado").innerHTML =
        "<pre>" +
        JSON.stringify(data, null, 2) +
        "</pre>";

};


const script =
document.createElement("script");


script.src =
API_URL +
"?callback=" +
callbackName;


script.onerror = function(){

    document.getElementById("resultado").innerHTML =
        "<h2>❌ FALLÓ LA CONEXIÓN</h2>";

};


document.body.appendChild(script);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AUTORITAS | Portal Administrativo</title>

<style>

:root{
  --azul:#0057a8;
  --azul-oscuro:#003b73;
  --azul-claro:#eaf4ff;
  --azul-medio:#1677c8;
  --blanco:#ffffff;
  --gris:#f4f7fa;
  --gris-borde:#dce4ec;
  --gris-texto:#667085;
  --verde:#159957;
  --rojo:#d92d20;
  --sombra:0 8px 25px rgba(0,55,110,.10);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#f3f7fb;
  color:#172b4d;
}

/* =========================
   ENCABEZADO
========================= */

.header{
  background:linear-gradient(135deg,var(--azul-oscuro),var(--azul));
  color:white;
  padding:22px 30px;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.header-inner{
  max-width:1450px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:15px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:12px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--azul);
  font-size:22px;
  font-weight:bold;
}

.header h1{
  margin:0;
  font-size:24px;
}

.header p{
  margin:4px 0 0;
  opacity:.85;
  font-size:13px;
}

.btn-refresh{
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.12);
  color:white;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.btn-refresh:hover{
  background:rgba(255,255,255,.2);
}

/* =========================
   CONTENEDOR
========================= */

.container{
  max-width:1450px;
  margin:auto;
  padding:25px;
}

/* =========================
   TARJETAS PRINCIPALES
========================= */

.metrics{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:22px;
}

.metric{
  background:white;
  border:1px solid var(--gris-borde);
  border-radius:16px;
  padding:20px;
  box-shadow:var(--sombra);
  position:relative;
  overflow:hidden;
}

.metric::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:5px;
  background:var(--azul);
}

.metric-label{
  font-size:12px;
  font-weight:bold;
  color:var(--gris-texto);
  text-transform:uppercase;
  letter-spacing:.5px;
}

.metric-value{
  font-size:32px;
  font-weight:800;
  color:var(--azul-oscuro);
  margin-top:6px;
}

.metric-detail{
  margin-top:5px;
  font-size:12px;
  color:#8a96a3;
}

/* =========================
   FILTROS
========================= */

.filters{
  background:white;
  border:1px solid var(--gris-borde);
  border-radius:16px;
  padding:18px;
  box-shadow:var(--sombra);
  margin-bottom:25px;
}

.filters-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr auto;
  gap:12px;
}

.input,
.select{
  width:100%;
  height:42px;
  border:1px solid #d0d7df;
  border-radius:9px;
  padding:0 13px;
  background:white;
  color:#172b4d;
  outline:none;
}

.input:focus,
.select:focus{
  border-color:var(--azul);
  box-shadow:0 0 0 3px rgba(0,87,168,.10);
}

.btn-clear{
  height:42px;
  border:0;
  border-radius:9px;
  padding:0 18px;
  background:#eef2f6;
  color:#344054;
  cursor:pointer;
  font-weight:bold;
}

.btn-clear:hover{
  background:#e2e8ef;
}

/* =========================
   ESTRUCTURA
========================= */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.section-title h2{
  margin:0;
  font-size:20px;
}

.section-title span{
  font-size:13px;
  color:var(--gris-texto);
}

.area{
  margin-bottom:22px;
}

.area-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
  color:#475467;
  font-size:13px;
  font-weight:bold;
  text-transform:uppercase;
}

.area-title::before{
  content:"";
  width:8px;
  height:8px;
  background:var(--azul);
  border-radius:50%;
}

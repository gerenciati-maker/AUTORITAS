<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Estado de Fuerza | Autoritas</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --azul:#063b78;
    --azul-2:#0756a0;
    --azul-3:#0b6fc4;
    --azul-claro:#eaf4ff;

    --verde:#16a34a;
    --verde-claro:#eaf8ef;

    --rojo:#dc2626;
    --rojo-claro:#fff0f0;

    --amarillo:#d97706;
    --amarillo-claro:#fff7e8;

    --gris:#64748b;
    --gris-claro:#f4f7fa;
    --gris-borde:#dce3ea;

    --texto:#172033;
    --blanco:#ffffff;

    --sombra:0 8px 24px rgba(0,40,90,.09);
}

body{
    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #eef6ff 0%,
            #f8fbff 45%,
            #eef4fa 100%
        );

    color:var(--texto);
    min-height:100vh;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    background:
        linear-gradient(
            135deg,
            #032c5d,
            #07559b
        );

    color:white;

    padding:26px 34px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.16);

    position:sticky;
    top:0;
    z-index:100;
}

.header-inner{
    max-width:1450px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:25px;
}

.brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo{
    width:52px;
    height:52px;

    border-radius:14px;

    background:white;

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--azul);
    font-size:22px;
    font-weight:900;

    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.brand h1{
    font-size:25px;
    font-weight:800;
    letter-spacing:.2px;
}

.brand p{
    margin-top:3px;
    font-size:13px;
    opacity:.78;
}

.update-btn{
    border:1px solid rgba(255,255,255,.25);

    background:
        rgba(255,255,255,.12);

    color:white;

    padding:11px 18px;

    border-radius:10px;

    cursor:pointer;

    font-weight:700;

    transition:.2s;
}

.update-btn:hover{
    background:rgba(255,255,255,.2);
    transform:translateY(-1px);
}


/* =====================================================
   CONTENEDOR
===================================================== */

.container{
    width:min(1450px,94%);
    margin:30px auto 60px;
}


/* =====================================================
   TARJETAS PRINCIPALES
===================================================== */

.metrics{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:18px;

    margin-bottom:28px;
}

.metric{
    background:white;

    border:1px solid var(--gris-borde);

    border-radius:18px;

    padding:23px;

    box-shadow:var(--sombra);

    position:relative;

    overflow:hidden;
}

.metric::after{
    content:"";

    position:absolute;

    right:-25px;
    top:-30px;

    width:110px;
    height:110px;

    background:
        rgba(7,86,160,.06);

    border-radius:50%;
}

.metric-label{
    font-size:12px;

    font-weight:800;

    letter-spacing:1px;

    color:var(--gris);

    text-transform:uppercase;
}

.metric-value{
    margin-top:6px;

    font-size:34px;

    font-weight:900;

    color:var(--azul);
}

.metric.bajas .metric-value{
    color:var(--rojo);
}


/* =====================================================
   CONTROLES
===================================================== */

.controls{
    background:white;

    border:1px solid var(--gris-borde);

    border-radius:16px;

    padding:18px;

    box-shadow:var(--sombra);

    display:grid;

    grid-template-columns:
        1.4fr
        1fr
        1fr
        auto;

    gap:12px;

    margin-bottom:28px;
}

.input,
.select{
    width:100%;

    border:1px solid var(--gris-borde);

    background:#fbfdff;

    color:var(--texto);

    padding:12px 14px;

    border-radius:10px;

    outline:none;

    font-size:14px;
}

.input:focus,
.select:focus{
    border-color:var(--azul-3);

    box-shadow:
        0 0 0 3px
        rgba(11,111,196,.1);
}

.clear-btn{
    border:0;

    background:var(--azul);

    color:white;

    padding:0 18px;

    border-radius:10px;

    font-weight:700;

    cursor:pointer;
}


/* =====================================================
   TITULOS
===================================================== */

.section-title{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin:28px 0 15px;
}

.section-title h2{
    font-size:20px;

    font-weight:850;

    color:#183b63;
}

.section-title span{
    color:var(--gris);

    font-size:13px;
}


/* =====================================================
   AREA
===================================================== */

.area-block{
    margin-bottom:30px;
}

.area-title{
    background:
        linear-gradient(
            90deg,
            var(--azul),
            var(--azul-2)
        );

    color:white;

    padding:13px 17px;

    border-radius:13px;

    font-size:14px;

    font-weight:850;

    letter-spacing:.5px;

    box-shadow:0 5px 14px rgba(0,55,110,.13);

    margin-bottom:14px;
}


/* =====================================================
   PROYECTOS
===================================================== */

.projects-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:17px;
}

.project{
    background:white;

    border:1px solid var(--gris-borde);

    border-radius:17px;

    overflow:hidden;

    box-shadow:
        0 5px 18px
        rgba(0,35,75,.07);
}

.project-header{
    padding:17px 18px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #f7fbff,
            #eef6ff
        );

    border-bottom:1px solid var(--gris-borde);
}

.project-name{
    display:flex;

    align-items:center;

    gap:11px;

    font-size:16px;

    font-weight:850;

    color:var(--azul);
}

.project-icon{
    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:9px;

    background:#dceeff;

    color:var(--azul);

    font-weight:900;
}

.project-count{
    background:white;

    border:1px solid var(--gris-borde);

    border-radius:20px;

    padding:5px 10px;

    font-size:12px;

    color:var(--gris);

    font-weight:800;
}

.arrow{
    transition:.2s;
}

.project.open .arrow{
    transform:rotate(180deg);
}

.project-body{
    display:none;

    padding:15px;
}

.project.open .project-body{
    display:block;
}


/* =====================================================
   SERVICIOS
===================================================== */

.service{
    border:1px solid var(--gris-borde);

    border-radius:13px;

    margin-bottom:11px;

    overflow:hidden;

    background:#fff;
}

.service-header{
    padding:13px 14px;

    cursor:pointer;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;
}

.service-header:hover{
    background:#f8fbff;
}

.service-info{
    display:flex;

    align-items:center;

    gap:10px;

    min-width:0;
}

.service-icon{
    width:30px;
    height:30px;

    border-radius:8px;

    background:var(--azul-claro);

    display:flex;

    align-items:center;
    justify-content:center;

    color:var(--azul);

    font-size:13px;

    flex-shrink:0;
}

.service-name{
    font-size:14px;

    font-weight:800;

    color:#243b53;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.service-meta{
    display:flex;

    align-items:center;

    gap:7px;

    flex-shrink:0;
}

.badge{
    padding:5px 8px;

    border-radius:7px;

    font-size:11px;

    font-weight:800;

    background:#f1f5f9;

    color:#475569;
}

.badge.ok{
    background:var(--verde-claro);

    color:var(--verde);
}

.badge.warn{
    background:var(--amarillo-claro);

    color:var(--amarillo);
}

.service-body{
    display:none;

    padding:0 14px 14px;
}

.service.open .service-body{
    display:block;
}


/* =====================================================
   POSICIONES
===================================================== */

.position{
    border-top:1px dashed #dfe6ed;

    padding:12px 0;
}

.position-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:10px;
}

.position-name{
    font-size:12px;

    font-weight:850;

    color:#64748b;

    text-transform:uppercase;

    letter-spacing:.5px;
}

.position-count{
    font-size:11px;

    color:#94a3b8;
}


/* =====================================================
   PERSONAS
===================================================== */

.people{
    display:flex;

    flex-wrap:wrap;

    gap:10px;
}

.person{
    display:flex;

    align-items:center;

    gap:10px;

    background:#f8fafc;

    border:1px solid #e4eaf0;

    border-radius:12px;

    padding:9px;

    min-width:235px;

    flex:1;
}

.person-photo{
    width:52px;
    height:62px;

    border-radius:8px;

    object-fit:cover;

    object-position:center;

    background:#dbe5ef;

    flex-shrink:0;

    border:1px solid #d5dee8;
}

.person-info{
    min-width:0;
}

.person-name{
    font-size:12px;

    font-weight:850;

    color:#1e293b;

    line-height:1.25;
}

.person-number{
    margin-top:3px;

    font-size:11px;

    color:#64748b;
}

.person-status{
    display:inline-block;

    margin-top:5px;

    padding:3px 6px;

    border-radius:5px;

    background:var(--verde-claro);

    color:var(--verde);

    font-size:9px;

    font-weight:900;
}


/* =====================================================
   BAJAS
===================================================== */

.bajas-section{
    margin-top:38px;

    background:white;

    border:1px solid #f0cccc;

    border-radius:18px;

    box-shadow:var(--sombra);

    overflow:hidden;
}

.bajas-header{
    padding:17px 20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #fff7f7,
            #fff1f1
        );
}

.bajas-title{
    display:flex;

    align-items:center;

    gap:10px;

    color:var(--rojo);

    font-weight:900;

    font-size:17px;
}

.bajas-count{
    background:#fee2e2;

    color:var(--rojo);

    padding:5px 10px;

    border-radius:20px;

    font-size:12px;

    font-weight:900;
}

.bajas-body{
    display:none;

    padding:18px;
}

.bajas-section.open .bajas-body{
    display:block;
}

.bajas-grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(260px,1fr));

    gap:13px;
}

.baja-card{
    display:flex;

    gap:12px;

    padding:12px;

    border:1px solid #f0d7d7;

    border-radius:12px;

    background:#fffafa;
}

.baja-photo{
    width:58px;
    height:68px;

    border-radius:8px;

    object-fit:cover;

    background:#eadede;

    flex-shrink:0;
}

.baja-name{
    font-size:13px;

    font-weight:850;

    color:#334155;
}

.baja-data{
    margin-top:4px;

    font-size:11px;

    line-height:1.55;

    color:#64748b;
}

.baja-data strong{
    color:#475569;
}


/* =====================================================
   ESTADOS
===================================================== */

.loading,
.empty,
.error{
    padding:45px 20px;

    text-align:center;

    color:var(--gris);

    background:white;

    border:1px solid var(--gris-borde);

    border-radius:16px;
}

.error{
    color:var(--rojo);

    border-color:#fecaca;

    background:#fff7f7;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{
    text-align:center;

    color:#94a3b8;

    font-size:11px;

    margin-top:35px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1100px){

    .metrics{
        grid-template-columns:
            repeat(2,1fr);
    }

    .controls{
        grid-template-columns:
            1fr 1fr;
    }

    .projects-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:700px){

    .header{
        padding:18px;
    }

    .header-inner{
        align-items:flex-start;
    }

    .brand h1{
        font-size:19px;
    }

    .logo{
        width:43px;
        height:43px;
    }

    .container{
        width:94%;
        margin-top:20px;
    }

    .metrics{
        grid-template-columns:
            repeat(2,1fr);

        gap:10px;
    }

    .metric{
        padding:16px;
    }

    .metric-value{
        font-size:28px;
    }

    .controls{
        grid-template-columns:1fr;
    }

    .clear-btn{
        height:44px;
    }

    .person{
        min-width:100%;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="header-inner">

        <div class="brand">

            <div class="logo">
                AF
            </div>

            <div>

                <h1>
                    Estado de Fuerza
                </h1>

                <p>
                    Directorio Digital de Personal
                </p>

            </div>

        </div>


        <button
            class="update-btn"
            onclick="cargarDatos()"
        >
            ↻ Actualizar
        </button>

    </div>

</header>



<main class="container">


<!-- =====================================================
     INDICADORES
===================================================== -->

<section class="metrics">


    <div class="metric">

        <div class="metric-label">
            Proyectos
        </div>

        <div
            class="metric-value"

    </div>


    <div class="metric">

        </div>

        <div
            class="metric-value"

        >

        </div>

    <div class="metric">

        </div>

<!-- =====================================================

===================================================== -->

<section class="controls">


    <input
        id="searchInput"

    >


    <select

        <option value="">

        </option>

        class="clear-btn"

    </button>

<!-- =====================================================

===================================================== -->

<section>

        <h2>

<div class="footer">

    Estado de Fuerza · Directorio Digital

</div>


</main>



<script>


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const API_URL =
    "https://script.google.com/macros/s/AKfycbxP3-4RBiMMVSmWAyamj9-HC4pR5Z2rx0KzDlyIsWWJ2iHILoFCxzGosRmWcz8rTq4/exec";


let servicios = [];

let personal = [];



/* =====================================================
   UTILIDADES
===================================================== */

function norm(valor){

    return String(
        valor ?? ""
    )
    .trim()
    .toUpperCase();

}


function texto(valor){

    return String(
        valor ?? ""
    ).trim();

}


function esActivo(persona){

    return norm(
        persona["ESTATUS"]
    ) === "ACTIVO";

}


function esBaja(persona){

    return norm(
        persona["ESTATUS"]
    ) === "BAJA";

}


function valor(persona,...nombres){

    for(
        const nombre of nombres
    ){

        if(
            Object.prototype
                .hasOwnProperty
                .call(
                    persona,
                    nombre
                )
        ){

            return texto(
                persona[nombre]
            );

        }

    }

    return "";

}


function unicos(valores){

    return [
        ...new Set(
            valores
            .map(texto)
            .filter(Boolean)
        )
    ]
    .sort(
        (a,b)=>
            a.localeCompare(
                b,
                "es",
                {
                    sensitivity:"base"
                }
            )
    );

}


/* =====================================================
   FOTO
===================================================== */

function crearAvatarSVG(nombre){

    const iniciales =
        texto(nombre)
        .split(/\s+/)
        .filter(Boolean)
        .slice(0,2)
        .map(
            palabra =>
                palabra.charAt(0)
        )
        .join("")
        .toUpperCase();

    const svg = `
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="160"
            height="190"
            viewBox="0 0 160 190"
        >

            <rect
                width="160"
                height="190"
                rx="14"
                fill="#dbeafe"
            />

            <circle
                cx="80"
                cy="67"
                r="31"
                fill="#94a3b8"
            />

            <path
                d="M31 166
                   C35 125 58 108 80 108
                   C102 108 125 125 129 166
                   Z"
                fill="#94a3b8"
            />

            <text
                x="80"
                y="181"
                text-anchor="middle"
                font-family="Arial"
                font-size="13"
                font-weight="700"
                fill="#475569"
            >
                ${iniciales || "?"}
            </text>

        </svg>
    `;

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg);

}


function normalizarFoto(url){

    const valorUrl =
        texto(url);

    if(!valorUrl){

        return "";

    }


    /*
     * Google Drive:
     * /file/d/ID/view
     */

    const match =
        valorUrl.match(
            /\/d\/([^/]+)/
        );

    if(match){

        return (
            "https://drive.google.com/thumbnail?id=" +
            match[1] +
            "&sz=w300"
        );

    }


    /*
     * Si ya es una URL directa
     */

    return valorUrl;

}


/* =====================================================
   CARGA JSONP
===================================================== */

function cargarDatos(){

    mostrarCarga();


    const callback =
        "estadoFuerza_" +
        Date.now();


    window[callback] =
        function(data){

            try{

                if(
                    !data ||
                    data.ok === false
                ){

                    throw new Error(
                        data &&
                        data.error
                            ? data.error
                            : "No se pudieron obtener los datos."
                    );

                }


                servicios =
                    Array.isArray(
                        data.servicios
                    )
                    ? data.servicios
                    : [];


                personal =
                    Array.isArray(
                        data.personal
                    )
                    ? data.personal
                    : [];


                actualizarInterfaz();


            }
            catch(error){

                mostrarError(
                    error.message
                );

            }
            finally{

                try{

                    delete window[callback];

                }
                catch(e){}

            }

        };


    const script =
        document.createElement(
            "script"
        );


    script.src =
        API_URL +
        "?callback=" +
        encodeURIComponent(
            callback
        ) +
        "&_=" +
        Date.now();


    script.onerror =
        function(){

            mostrarError(
                "No se pudo conectar con la base de datos."
            );

            try{

                delete window[callback];

            }
            catch(e){}

        };


    document.body.appendChild(
        script
    );

}



/* =====================================================
   ACTUALIZAR INTERFAZ
===================================================== */

function actualizarInterfaz(){

    construirFiltros();

    actualizarMetricas();

    renderizarOrganigrama();

    renderizarBajas();

}


/* =====================================================
   MÉTRICAS
===================================================== */

function actualizarMetricas(){

    const activos =
        personal.filter(
            esActivo
        );

    const bajas =
        personal.filter(
            esBaja
        );


    const proyectos =
        unicos(
            activos.map(
                persona =>
                    valor(
                        persona,

/* =====================================================
   FILTRAR PERSONAL
===================================================== */

function obtenerPersonalFiltrado(){

    const activos =
        personal.filter(
            esActivo
        );


    const busqueda =
        norm(
            document.getElementById(
                "searchInput"
            ).value
        );


    const area =
        norm(
            document.getElementById(
                "areaFilter"
            ).value
        );


    const proyecto =
        norm(
            document.getElementById(
                "projectFilter"
            ).value
        );


    return activos.filter(
        persona => {

            const nombre =
                valor(
                    persona,
                    "Nombre",
                    "NOMBRE"
                );

            const numero =
                valor(
                    persona,
                    "No Empleado",
                    "NO EMPLEADO",
                    "No. Empleado"
                );

            const servicio =
                valor(
                    persona,
                    "Servicio",
                    "SERVICIO"
                );

            const areaPersona =
                valor(
                    persona,
                    "AREA",
                    "Area"
                );

            const proyectoPersona =
                valor(
                    persona,
                    "PROYECTO"
                );

            const posicion =
                valor(
                    persona,
                    "POSICION",
                    "Posicion"
                );


            const textoBusqueda =
                norm(
                    [
                        nombre,
                        numero,
                        servicio,
                        areaPersona,
                        proyectoPersona,
                        posicion
                    ].join(" ")
                );


            if(
                busqueda &&
                !textoBusqueda.includes(
                    busqueda
                )
            ){

                return false;

            }


            if(
                area &&
                norm(areaPersona) !== area
            ){

                return false;

            }


            if(
                proyecto &&
                norm(proyectoPersona) !== proyecto
            ){

                return false;

            }


            return true;

        }
    );

}


/* =====================================================
   RENDER ORGANIGRAMA
===================================================== */

function renderizarOrganigrama(){

    const contenedor =
        document.getElementById(
            "organigrama"
        );


    const activos =
        obtenerPersonalFiltrado();


    document.getElementById(
        "resultInfo"
    ).textContent =
        activos.length +
        " personas activas";


    if(
        !activos.length
    ){

        contenedor.innerHTML = `
            <div class="empty">
                No se encontraron personas con los filtros actuales.
            </div>
        `;

        return;

    }


    /*
     * AREA
     *   └── PROYECTO
     *          └── SERVICIO
     *                 └── POSICION
     *                        └── PERSONAS
     */

    const areas = {};


    activos.forEach(
        persona => {

            const area =
                valor(
                    persona,
                    "AREA",
                    "Area"
                ) ||
                "SIN ÁREA";


            const proyecto =
                valor(
                    persona,
                    "PROYECTO"
                ) ||
                "SIN PROYECTO";


            const servicio =
                valor(
                    persona,
                    "Servicio",
                    "SERVICIO"
                ) ||
                "SIN SERVICIO";


            const posicion =
                valor(
                    persona,
                    "POSICION",
                    "Posicion"
                ) ||
                "SIN POSICIÓN";


            if(!areas[area]){

                areas[area] = {};

            }


            if(!areas[area][proyecto]){

                areas[area][proyecto] = {};

            }


            if(
                !areas[area][proyecto][servicio]
            ){

                areas[area][proyecto][servicio] = {};

            }


            if(
                !areas[area]
                    [proyecto]
                    [servicio]
                    [posicion]
            ){

                areas[area]
                    [proyecto]
                    [servicio]
                    [posicion] = [];

            }


            areas[area]
                [proyecto]
                [servicio]
                [posicion]
                .push(persona);

        }
    );


    let html = "";


    Object.keys(areas)
    .sort()
    .forEach(
        area => {

            html += `
                <div class="area-block">

                    <div class="area-title">
                        ${escapeHtml(area)}
                    </div>

                    <div class="projects-grid">
            `;


            Object.keys(
                areas[area]
            )
            .sort()
            .forEach(
                proyecto => {

                    const proyectoData =
                        areas[area][proyecto];


                    let totalPersonas = 0;


                    Object.values(
                        proyectoData
                    ).forEach(
                        servicio => {

                            Object.values(
                                servicio
                            ).forEach(
                                posicion => {

                                    totalPersonas +=
                                        posicion.length;

                                }
                            );

                        }
                    );


                    const projectId =
                        "project_" +
                        Math.random()
                            .toString(36)
                            .slice(2);


                    html += `
                        <article
                            class="project"
                            data-project="${escapeAttr(projecto)}"
                        >

                            <div
                                class="project-header"
                                onclick="toggleProject(this)"
                            >

                                <div class="project-name">

                                    <div class="project-icon">
                                        ▦
                                    </div>

                                    <span>
                                        ${escapeHtml(proyecto)}
                                    </span>

                                </div>


                                <div
                                    style="
                                        display:flex;
                                        align-items:center;
                                        gap:9px;
                                    "
                                >

                                    <span class="project-count">
                                        ${totalPersonas}
                                        ${totalPersonas === 1 ? "persona" : "personas"}
                                    </span>

                                    <span class="arrow">
                                        ▼
                                    </span>

                                </div>

                            </div>


                            <div class="project-body">
                    `;


                    Object.keys(
                        proyectoData
                    )
                    .sort()
                    .forEach(
                        servicio => {

                            const servicioData =
                                proyectoData[
                                    servicio
                                ];


                            let totalServicio = 0;


                            Object.values(
                                servicioData
                            ).forEach(
                                personas =>
                                    totalServicio +=
                                        personas.length
                            );


                            const servicioInfo =
                                buscarServicioInfo(
                                    servicio
                                );


                            let badgeClass =
                                "badge";


                            if(
                                servicioInfo
                                .encontrado
                            ){

                                if(
                                    servicioInfo.es >=
                                    servicioInfo.debe &&
                                    servicioInfo.debe > 0
                                ){

                                    badgeClass =
                                        "badge ok";

                                }
                                else if(
                                    servicioInfo.debe > 0
                                ){

                                    badgeClass =
                                        "badge warn";

                                }

                            }


                            html += `
                                <div class="service">

                                    <div
                                        class="service-header"
                                        onclick="toggleService(this)"
                                    >

                                        <div class="service-info">

                                            <div class="service-icon">
                                                ◉
                                            </div>

                                            <div class="service-name">
                                                ${escapeHtml(servicio)}
                                            </div>

                                        </div>


                                        <div class="service-meta">

                                            ${
                                                servicioInfo.encontrado
                                                ?
                                                `
                                                    <span class="${badgeClass}">
                                                        ${servicioInfo.debe}
                                                        /
                                                        ${servicioInfo.es}
                                                    </span>
                                                `
                                                :
                                                `
                                                    <span class="badge">
                                                        ${totalServicio}
                                                        ${totalServicio === 1 ? "persona" : "personas"}
                                                    </span>
                                                `
                                            }

                                            <span>
                                                ▼
                                            </span>

                                        </div>

                                    </div>


                                    <div class="service-body">
                            `;


                            Object.keys(
                                servicioData
                            )
                            .sort()
                            .forEach(
                                posicion => {

                                    const personas =
                                        servicioData[
                                            posicion
                                        ];


                                    html += `
                                        <div class="position">

                                            <div class="position-header">

                                                <span class="position-name">
                                                    ${escapeHtml(posicion)}
                                                </span>

                                                <span class="position-count">
                                                    ${personas.length}
                                                </span>

                                            </div>


                                            <div class="people">
                                    `;


                                    personas.forEach(
                                        persona => {

                                            html +=
                                                crearPersonaCard(
                                                    persona
                                                );

                                        }
                                    );


                                    html += `
                                            </div>

                                        </div>
                                    `;

                                }
                            );


                            html += `
                                    </div>

                                </div>
                            `;

                        }
                    );


                    html += `
                            </div>

                        </article>
                    `;

                }
            );


            html += `
                    </div>

                </div>
            `;

        }
    );


    contenedor.innerHTML =
        html;

}


/* =====================================================
   INFO SERVICIO
===================================================== */

function buscarServicioInfo(
    nombre
){

    const objetivo =
        norm(nombre);


    /*
     * Primero buscamos por:
     * CODIFICACIÓN...
     */

    let registro =
        servicios.find(
            servicio =>
                norm(
                    servicio[
                        "CODIFICACIÓN DE UN FORMULARIO Y SERVICIO"
                    ]
                ) === objetivo
        );


    /*
     * Segundo intento:
     * SERVICIO
     */

    if(!registro){

        registro =
            servicios.find(
                servicio =>
                    norm(
                        servicio[
                            "SERVICIO"
                        ]
                    ) === objetivo
            );

    }


    if(!registro){

        return {
            encontrado:false,
            debe:0,
            es:0
        };

    }


    return {

        encontrado:true,

        debe:
            Number(
                registro["DEBE"]
            ) || 0,

        es:
            Number(
                registro["ES"]
            ) || 0

    };

}


/* =====================================================
   TARJETA PERSONA

function crearPersonaCard(
    persona
){

    const nombre =
        valor(
            persona,
            "Nombre",
            "NOMBRE"
        ) ||
        "Sin nombre";


    const numero =
        valor(
            persona,
            "No Empleado",
            "NO EMPLEADO",
            "No. Empleado"
        ) ||
        "Sin número";


    const foto =
        normalizarFoto(
            valor(
                persona,
                "FOTO",
                "Foto",
                "foto"
            )
        );


    const imagen =
        foto ||
        crearAvatarSVG(
            nombre
        );


    return `

        <div class="person">

            <img
                class="person-photo"
                src="${escapeAttr(imagen)}"
                alt="${escapeAttr(nombre)}"
                loading="lazy"
                onerror="
                    this.onerror=null;
                    this.src='${escapeAttr(
                        crearAvatarSVG(nombre)
                    )}';
                "
            >


            <div class="person-info">

                <div class="person-name">
                    ${escapeHtml(nombre)}
                </div>

                <div class="person-number">
                    No. ${escapeHtml(numero)}
                </div>

                <span class="person-status">
                    ACTIVO
                </span>

            </div>

        </div>

    `;

}

function renderizarBajas(){

    const bajas =
        personal.filter(
            esBaja
        );


    const contenedor =
        document.getElementById(
            "bajasGrid"
        );


    if(!bajas.length){

        contenedor.innerHTML = `
            <div class="empty">
                No hay personal dado de baja.
            </div>
        `;

        return;

    }


    bajas.sort(
        (a,b) => {

            const nombreA =
                valor(
                    a,
                    "Nombre",
                    "NOMBRE"
                );

            const nombreB =
                valor(
                    b,
                    "Nombre",
                    "NOMBRE"
                );

            return nombreA.localeCompare(
                nombreB,
                "es",
                {
                    sensitivity:"base"
                }
            );

        }
    );


    contenedor.innerHTML =
        bajas
        .map(
            persona => {

                const nombre =

                    ) ||

                const numero =
                    valor(

                    ) ||
                    "Sin número";


                const servicio =
                    valor(
                        persona,
                        "Servicio",
                        "SERVICIO"
                    ) ||
                    "Sin servicio";


                const proyecto =
                    valor(
                        persona,
                        "PROYECTO"
                    ) ||
                    "Sin proyecto";


                const posicion =
                    valor(
                        persona,
                        "POSICION",
                        "Posicion"
                    ) ||
                    "Sin posición";


                const fecha =
                    valor(
                        persona,
                        "FECHA BAJA",

                    ) ||
                    "Sin fecha";


                const foto =
                    normalizarFoto(
                        valor(

                        )
                    );


                const imagen =

                                ${escapeHtml(servicio)}

                                <strong>

                                <strong>

/* =====================================================
   SEGURIDAD HTML
===================================================== */

function escapeHtml(
    valor
){

    return String(
        valor ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttr(
    valor
){

    return escapeHtml(
        valor
    );

}

```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AUTORITAS | Portal Administrativo</title>

<style>

:root{
  --azul:#0057a8;
  --azul-oscuro:#003b73;
  --azul-claro:#eaf4ff;
  --azul-medio:#1677c8;
  --blanco:#ffffff;
  --gris:#f4f7fa;
  --gris-borde:#dce4ec;
  --gris-texto:#667085;
  --verde:#159957;
  --rojo:#d92d20;
  --sombra:0 8px 25px rgba(0,55,110,.10);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#f3f7fb;
  color:#172b4d;
}

/* =====================================================
   ENCABEZADO
===================================================== */

.header{
  background:linear-gradient(135deg,var(--azul-oscuro),var(--azul));
  color:white;
  padding:18px 30px 0;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.header-inner{
  max-width:1450px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:15px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:12px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--azul);
  font-size:22px;
  font-weight:bold;
}

.header h1{
  margin:0;
  font-size:24px;
}

.header p{
  margin:4px 0 0;
  opacity:.85;
  font-size:13px;
}

.btn-refresh{
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.12);
  color:white;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.btn-refresh:hover{
  background:rgba(255,255,255,.2);
}

/* =====================================================
   NAVEGACIÓN
===================================================== */

.nav-modulos{
  max-width:1450px;
  margin:auto;
  display:flex;
  gap:5px;
  overflow-x:auto;
}

.nav-modulo{
  border:0;
  background:transparent;
  color:rgba(255,255,255,.78);
  padding:13px 20px;
  cursor:pointer;
  font-size:12px;
  font-weight:800;
  letter-spacing:.3px;
  border-radius:9px 9px 0 0;
  white-space:nowrap;
  transition:.2s;
}

.nav-modulo:hover{
  background:rgba(255,255,255,.10);
  color:white;
}

.nav-modulo.active{
  background:white;
  color:var(--azul);
}

/* =====================================================
   CONTENEDORES DE MÓDULOS
===================================================== */

.modulo{
  display:none;
}

.modulo.activo{
  display:block;
}

/* =====================================================
   CONTENEDOR
===================================================== */

.container{
  max-width:1450px;
  margin:auto;
  padding:25px;
}

/* =====================================================
   TARJETAS PRINCIPALES
===================================================== */

.metrics{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:22px;
}

.metric{
  background:white;
  border:1px solid var(--gris-borde);
  border-radius:16px;
  padding:20px;
  box-shadow:var(--sombra);
  position:relative;
  overflow:hidden;
}

.metric::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:5px;
  background:var(--azul);
}

.metric-label{
  font-size:12px;
  font-weight:bold;
  color:var(--gris-texto);
  text-transform:uppercase;
  letter-spacing:.5px;
}

.metric-value{
  font-size:32px;
  font-weight:800;
  color:var(--azul-oscuro);
  margin-top:6px;
}

.metric-detail{
  margin-top:5px;
  font-size:12px;
  color:#8a96a3;
}

/* =====================================================
   FILTROS
===================================================== */

.filters{
  background:white;
  border:1px solid var(--gris-borde);
  border-radius:16px;
  padding:18px;
  box-shadow:var(--sombra);
  margin-bottom:25px;
}

.filters-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr auto;
  gap:12px;
}

.input,
.select{
  width:100%;
  height:42px;
  border:1px solid #d0d7df;
  border-radius:9px;
  padding:0 13px;
  background:white;
  color:#172b4d;
  outline:none;
}

.input:focus,
.select:focus{
  border-color:var(--azul);
  box-shadow:0 0 0 3px rgba(0,87,168,.10);
}

.btn-clear{
  height:42px;
  border:0;
  border-radius:9px;
  padding:0 18px;
  background:#eef2f6;
  color:#344054;
  cursor:pointer;
  font-weight:bold;
}

.btn-clear:hover{
  background:#e2e8ef;
}

.btn-primary{
  height:42px;
  border:0;
  border-radius:9px;
  padding:0 20px;
  background:var(--azul);
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.btn-primary:hover{
  background:var(--azul-oscuro);
}

/* =====================================================
   ESTRUCTURA
===================================================== */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.section-title h2{
  margin:0;
  font-size:20px;
}

.section-title span{
  font-size:13px;
  color:var(--gris-texto);
}

.area{
  margin-bottom:22px;
}

.area-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
  color:#475467;
  font-size:13px;
  font-weight:bold;
  text-transform:uppercase;
}

.area-title::before{
  content:"";
  width:8px;
  height:8px;
  background:var(--azul);
  border-radius:50%;
}

/* =====================================================
   PROYECTOS
===================================================== */

.project{
  background:white;
  border:1px solid var(--gris-borde);
  border-radius:15px;
  margin-bottom:13px;
  overflow:hidden;
  box-shadow:0 4px 14px rgba(0,50,100,.06);
}

.project-header{
  width:100%;
  border:0;
  background:white;
  padding:17px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  text-align:left;
}

.project-header:hover{
  background:#f8fbff;
}

.project-left{
  display:flex;
  align-items:center;
  gap:13px;
}

.project-icon{
  width:38px;
  height:38px;
  border-radius:10px;
  background:var(--azul-claro);
  color:var(--azul);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.project-name{
  font-size:16px;
  font-weight:800;
  color:#17365d;
}

.project-count{
  font-size:12px;
  color:var(--gris-texto);
  margin-top:3px;
}

.arrow{
  font-size:18px;
  color:#667085;
  transition:.2s;
}

.project.open .arrow{
  transform:rotate(180deg);
}

.project-body{
  display:none;
  padding:0 18px 18px;
  border-top:1px solid #edf1f5;
}

.project.open .project-body{
  display:block;
}

/* =====================================================
   SERVICIOS
===================================================== */

.service{
  margin-top:14px;
  border:1px solid #e2e8ef;
  border-radius:12px;
  overflow:hidden;
}

.service-header{
  width:100%;
  border:0;
  background:#f8fafc;
  padding:13px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  text-align:left;
}

.service-header:hover{
  background:#f1f6fb;
}

.service-info{
  display:flex;
  align-items:center;
  gap:10px;
}

.service-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--azul);
}

.service-name{
  font-size:14px;
  font-weight:700;
}

.service-meta{
  display:flex;
  gap:8px;
  align-items:center;
}

.badge{
  padding:4px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:bold;
  background:#eaf4ff;
  color:var(--azul);
}

.service-body{
  display:none;
  padding:13px;
  background:white;
}

.service.open .service-body{
  display:block;
}

/* =====================================================
   POSICIONES
===================================================== */

.position{
  margin-bottom:13px;
}

.position:last-child{
  margin-bottom:0;
}

.position-title{
  font-size:11px;
  color:#667085;
  font-weight:bold;
  text-transform:uppercase;
  margin:0 0 8px 3px;
}

/* =====================================================
   PERSONAS
===================================================== */

.people{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:10px;
}

.person{
  display:flex;
  align-items:center;
  gap:12px;
  border:1px solid #e4e9ef;
  border-radius:11px;
  padding:10px;
  background:#fff;
}

.person:hover{
  border-color:#b9d5ef;
  box-shadow:0 3px 10px rgba(0,80,150,.08);
}

.person-photo{
  width:54px;
  height:64px;
  border-radius:9px;
  object-fit:cover;
  background:#eaf1f8;
  flex-shrink:0;
}

.person-info{
  min-width:0;
}

.person-name{
  font-size:13px;
  font-weight:800;
  color:#243b53;
  line-height:1.25;
}

.person-number{
  font-size:11px;
  color:#667085;
  margin-top:4px;
}

.person-status{
  display:inline-block;
  margin-top:5px;
  padding:3px 7px;
  border-radius:15px;
  background:#e8f7ef;
  color:var(--verde);
  font-size:9px;
  font-weight:bold;
}

/* =====================================================
   BAJAS
===================================================== */

.bajas-section{
  margin-top:30px;
}

.bajas-box{
  background:white;
  border:1px solid #f1c7c3;
  border-radius:15px;
  overflow:hidden;
  box-shadow:var(--sombra);
}

.bajas-header{
  padding:16px 20px;
  background:#fff8f7;
  color:#9f2017;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
}

.bajas-title{
  font-weight:800;
}

.bajas-body{
  padding:16px;
  display:none;
}

.bajas-box.open .bajas-body{
  display:block;
}

.baja-person{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px;
  border-bottom:1px solid #eee;
}

.baja-person:last-child{
  border-bottom:0;
}

/* =====================================================
   ESTADOS
===================================================== */

.empty{
  background:white;
  border:1px dashed #cbd5df;
  border-radius:14px;
  padding:40px 20px;
  text-align:center;
  color:#667085;
}

.loading{
  background:white;
  border-radius:14px;
  padding:40px;
  text-align:center;
  color:#667085;
}

/* =====================================================
   TABLAS DINÁMICAS
===================================================== */

.tabla-box{
  background:white;
  border:1px solid var(--gris-borde);
  border-radius:16px;
  padding:18px;
  box-shadow:var(--sombra);
}

.tabla-wrap{
  width:100%;
  overflow:auto;
  border:1px solid #e1e7ee;
  border-radius:12px;
}

.tabla-dinamica{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

.tabla-dinamica th,
.tabla-dinamica td{
  padding:11px 13px;
  border-bottom:1px solid #edf1f5;
  border-right:1px solid #edf1f5;
  text-align:left;
  font-size:12px;
  white-space:nowrap;
}

.tabla-dinamica th{
  background:#f4f7fa;
  color:#475467;
  font-size:10px;
  text-transform:uppercase;
  font-weight:800;
  position:sticky;
  top:0;
  z-index:2;
}

.tabla-dinamica tbody tr:hover{
  background:#f8fbff;
}

.tabla-dinamica td{
  color:#344054;
}

/* =====================================================
   ASISTENCIAS
===================================================== */

.asistencias-section{
  padding:25px;
  max-width:1450px;
  margin:auto;
}

.asistencias-box{
  background:white;
  border:1px solid var(--gris-borde);
  border-radius:16px;
  padding:20px;
  box-shadow:var(--sombra);
}

.asistencias-filtros{
  display:grid;
  grid-template-columns:2fr 1fr 1fr auto;
  gap:12px;
  margin-bottom:20px;
}

.asistencias-info{
  background:#f8fbff;
  border:1px solid #dcecff;
  border-radius:12px;
  padding:15px;
  margin-bottom:20px;
}

.asistencias-info-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:15px;
}

.asistencia-info-label{
  font-size:10px;
  color:#667085;
  font-weight:bold;
  text-transform:uppercase;
}

.asistencia-info-value{
  margin-top:4px;
  font-size:14px;
  font-weight:800;
  color:#17365d;
}

.faltas-box{
  margin-bottom:20px;
  border:1px solid #f1d3d0;
  border-radius:12px;
  overflow:hidden;
}

.faltas-header{
  padding:13px 16px;
  background:#fff8f7;
  color:#9f2017;
  font-weight:800;
}

.faltas-table{
  width:100%;
  border-collapse:collapse;
}

.faltas-table th,
.faltas-table td{
  padding:9px 12px;
  border-bottom:1px solid #edf1f5;
  text-align:left;
  font-size:12px;
}

.faltas-table th{
  background:#fafafa;
  color:#667085;
  font-size:10px;
  text-transform:uppercase;
}

.faltas-numero{
  font-weight:800;
  color:#d92d20;
}

.asistencia-table-wrap{
  width:100%;
  overflow:auto;
  border:1px solid #e1e7ee;
  border-radius:12px;
}

.asistencia-table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

.asistencia-table th,
.asistencia-table td{
  border-right:1px solid #e5eaf0;
  border-bottom:1px solid #e5eaf0;
  padding:8px;
  text-align:center;
  font-size:11px;
  white-space:nowrap;
}

.asistencia-table th{
  background:#f4f7fa;
  color:#475467;
  font-weight:800;
  position:sticky;
  top:0;
  z-index:2;
}

.asistencia-table th:first-child,
.asistencia-table td:first-child{
  position:sticky;
  left:0;
  background:white;
  z-index:3;
  text-align:left;
}

.asistencia-table th:first-child{
  background:#f4f7fa;
  z-index:4;
}

.asistencia-nombre{
  font-weight:800;
  color:#243b53;
}

.asistencia-numero{
  font-size:10px;
  color:#667085;
  margin-top:2px;
}

.codigo-asistencia{
  display:inline-flex;
  min-width:28px;
  height:28px;
  padding:0 6px;
  align-items:center;
  justify-content:center;
  border-radius:7px;
  font-weight:800;
  background:#f2f4f7;
  color:#667085;
}

.codigo-A{
  background:#e8f7ef;
  color:#159957;
}

.codigo-F{
  background:#fdecea;
  color:#d92d20;
}

.codigo-AP{
  background:#eaf4ff;
  color:#0057a8;
}

.codigo-D{
  background:#f2f4f7;
  color:#667085;
}

.codigo-R{
  background:#fff4d6;
  color:#9a6700;
}

.codigo-FR{
  background:#fff0e6;
  color:#c2410c;
}

.codigo-V,
.codigo-AB,
.codigo-VAC,
.codigo-INC,
.codigo-NC{
  background:#f1eaff;
  color:#6941c6;
}

.asistencias-leyenda{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}

.leyenda-item{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:11px;
  color:#667085;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1000px){

  .metrics{
    grid-template-columns:repeat(2,1fr);
  }

  .filters-grid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:900px){

  .asistencias-filtros{
    grid-template-columns:1fr 1fr;
  }

  .asistencias-info-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:650px){

  .header{
    padding:18px 18px 0;
  }

  .header-inner{
    align-items:flex-start;
  }

  .header h1{
    font-size:19px;
  }

  .container{
    padding:15px;
  }

  .metrics{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .metric{
    padding:15px;
  }

  .metric-value{
    font-size:25px;
  }

  .filters-grid{
    grid-template-columns:1fr;
  }

  .people{
    grid-template-columns:1fr;
  }

  .asistencias-section{
    padding:15px;
  }

  .asistencias-filtros{
    grid-template-columns:1fr;
  }

  .nav-modulo{
    padding:12px 13px;
    font-size:10px;
  }

}

</style>
</head>

<body>

<!-- =====================================================
     ENCABEZADO
===================================================== -->

<header class="header">

  <div class="header-inner">

    <div class="brand">

      <div class="logo">
        AF
      </div>

      <div>
        <h1>AUTORITAS</h1>
        <p>Portal Administrativo</p>
      </div>

    </div>

    <button
      class="btn-refresh"
      onclick="cargarDatos()">
      ↻ Actualizar
    </button>

  </div>

  <!-- ===================================================
       NAVEGACIÓN PRINCIPAL
  ==================================================== -->

  <nav class="nav-modulos">

    <button
      class="nav-modulo active"
      data-modulo="moduloEstadoFuerza"
      onclick="mostrarModulo('moduloEstadoFuerza',this)">
      ESTADO DE FUERZA
    </button>

    <button
      class="nav-modulo"
      data-modulo="moduloDirectorio"
      onclick="mostrarModulo('moduloDirectorio',this)">
      DIRECTORIO DE SERVICIOS
    </button>

    <button
      class="nav-modulo"
      data-modulo="moduloUnidades"
      onclick="mostrarModulo('moduloUnidades',this)">
      UNIDADES
    </button>

    <button
      class="nav-modulo"
      data-modulo="moduloAsistencias"
      onclick="mostrarModulo('moduloAsistencias',this)">
      ASISTENCIAS
    </button>

  </nav>

</header>


<!-- =====================================================
     MÓDULO 1
     ESTADO DE FUERZA
===================================================== -->

<section
  id="moduloEstadoFuerza"
  class="modulo activo">

  <main class="container">

    <!-- MÉTRICAS -->

    <section class="metrics">

      <div class="metric">

        <div class="metric-label">
          Proyectos
        </div>

        <div
          class="metric-value"
          id="metricProyectos">
          0
        </div>

        <div class="metric-detail">
          Proyectos activos
        </div>

      </div>


      <div class="metric">

        <div class="metric-label">
          Personal
        </div>

        <div
          class="metric-value"
          id="metricPersonal">
          0
        </div>

        <div class="metric-detail">
          Personal activo
        </div>

      </div>


      <div class="metric">

        <div class="metric-label">
          Servicios
        </div>

        <div
          class="metric-value"
          id="metricServicios">
          0
        </div>

        <div class="metric-detail">
          Servicios con personal
        </div>

      </div>


      <div class="metric">

        <div class="metric-label">
          Bajas
        </div>

        <div
          class="metric-value"
          id="metricBajas">
          0
        </div>

        <div class="metric-detail">
          Personal dado de baja
        </div>

      </div>

    </section>


    <!-- FILTROS -->

    <section class="filters">

      <div class="filters-grid">

        <input
          id="search"
          class="input"
          type="text"
          autocomplete="off"
          placeholder="Buscar por nombre, empleado, servicio o posición..."
        >


        <select
          id="areaFilter"
          class="select">

          <option value="">
            Todas las áreas
          </option>

        </select>


        <select
          id="projectFilter"
          class="select">

          <option value="">
            Todos los proyectos
          </option>

        </select>


        <button
          class="btn-clear"
          onclick="limpiarFiltros()">

          Limpiar

        </button>

      </div>

    </section>


    <!-- DIRECTORIO ACTUAL DE PERSONAL -->

    <section>

      <div class="section-title">

        <h2>
          Estructura de personal
        </h2>

        <span id="resultInfo">
          Cargando...
        </span>

      </div>


      <div
        id="organigrama"
        class="loading">

        Cargando información...

      </div>

    </section>


    <!-- BAJAS -->

    <section class="bajas-section">

      <div class="section-title">

        <h2>
          Personal dado de baja
        </h2>

        <span id="bajasInfo">
          0 registros
        </span>

      </div>


      <div
        id="bajasBox"
